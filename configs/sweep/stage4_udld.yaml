# Stage 4 - udLD. Inherit epsilon / beta0 from the odLD winner, sweep only the
# underdamped step size delta. Compute the absolute epsilon from the Stage-3
# winner as  epsilon = mcsdca_epsilon_ratio * mcsdca_eta  (udLD takes epsilon
# directly, not as a ratio). Stage 0 already stress-tested delta=0.3 for
# stability. 1 seed to shortlist, then rerun with seed: [3072, 3073, 3074].
base:
  training_profile: small
  data_fraction: 0.10
  optimizers: MCSDCA-udLD
  backprop_budget: 5000
  device: cuda
  seed: 3072
  mcsdca_epsilon: 1.0e-4    # <-- odLD winner: ratio 1e-2 * eta 1e-2
  mcsdca_beta0: 0.9         # <-- odLD winner
grid:
  mcsdca_delta: [0.03, 0.1, 0.3]
output: outputs/sweep/stage4_udld
