# Stage 2 - refine odLD around the Stage-1 top-2, full `small` budget, 1 seed.
# EDIT the grid below to bracket the Stage-1 winners before running.
base:
  training_profile: small
  data_fraction: 0.10
  optimizers: MCSDCA-odLD
  # backprop_budget omitted -> uses the `small` profile full budget
  device: auto
  seed: 3072
grid:
  mcsdca_eta: [2.0e-3, 3.0e-3, 5.0e-3]     # <-- edit around Stage-1 winner
  mcsdca_epsilon: [1.0e-8, 1.0e-6]         # <-- edit around Stage-1 winner
  mcsdca_beta0: [0.9, 0.99]                # <-- edit around Stage-1 winner
output: outputs/sweep/stage2_odld
