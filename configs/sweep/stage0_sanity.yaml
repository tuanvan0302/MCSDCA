# Stage 0 - sanity. Tiny CPU-runnable grid: does MCSDCA run, stay finite, and
# does the inner chain loss (sampler_loss) go down for at least one corner?
#   uv run python src/sweep.py configs/sweep/stage0_sanity.yaml
base:
  training_profile: smoke
  data_fraction: 0.05
  optimizers: MCSDCA-odLD
  backprop_budget: 120
  eval_interval: 40
  device: auto
  seed: 3072
grid:
  mcsdca_eta: [1.0e-3, 1.0e-2]
  mcsdca_epsilon: [1.0e-8, 1.0e-2]
  mcsdca_beta0: [0.9]
output: outputs/sweep/stage0_sanity
