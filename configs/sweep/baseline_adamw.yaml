# Baseline AdamW sweep so the final comparison is tuned-vs-tuned.
# 1 seed to pick lr/weight_decay, then rerun with seed: [3072, 3073, 3074].
base:
  training_profile: small
  data_fraction: 0.10
  optimizers: AdamW
  device: auto
  seed: 3072
grid:
  lr: [2.0e-5, 5.0e-5, 1.0e-4]
  weight_decay: [0.0, 1.0e-3]
output: outputs/sweep/baseline_adamw
