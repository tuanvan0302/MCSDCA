# Baseline AdamW sweep so the final comparison is tuned-vs-tuned.
# 3 x 3 = 9 points, 1 seed to pick lr/weight_decay, then rerun with
# seed: [3072, 3073, 3074]. weight_decay includes 1e-2 so AdamW gets a fair shot
# at explicit regularization (the MCSDCA hypothesis is about implicit reg).
base:
  training_profile: small
  data_fraction: 0.10
  optimizers: AdamW
  backprop_budget: 5000
  device: cuda
  seed: 3072
grid:
  lr: [2.0e-5, 5.0e-5, 1.0e-4]
  weight_decay: [0.0, 1.0e-3, 1.0e-2]
output: outputs/sweep/baseline_adamw
