# Stage 3 - confirm the odLD winner across 3 seeds (longer rank budget).
# Replace the single-value grid entries with the Stage-2 winner. epsilon is the
# ratio epsilon/eta; the absolute epsilon = ratio * eta is what Stage 4 and
# configs/ablation.yaml inherit.
base:
  training_profile: small
  data_fraction: 0.10
  optimizers: MCSDCA-odLD
  backprop_budget: 8000
  device: cuda
grid:
  seed: [3072, 3073, 3074]
  mcsdca_eta: [1.0e-2]              # <-- Stage-2 winner
  mcsdca_epsilon_ratio: [1.0e-2]   # <-- Stage-2 winner
  mcsdca_beta0: [0.9]             # <-- Stage-2 winner
output: outputs/sweep/stage3_confirm_odld
