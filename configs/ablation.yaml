# PushT data-scaling ablation. Everything is held fixed except data_fraction;
# `budget` is the SAME backprop budget at every fraction (so smaller fractions
# just get more passes over less data). Fill the MCSDCA overrides from the
# sweep Stage-3 / Stage-4 winners and the AdamW lr/wd from baseline_adamw.
#
# `src/run_experiment1.py` writes these winners automatically per fraction; this
# file is the manual path.
profile: small
device: cuda
budget: 8000                       # <-- fixed backprop budget, identical at every fraction
fractions: [0.1, 0.25, 0.5, 1.0]
seeds: [3072, 3073, 3074]
output: outputs/ablation
optimizers:
  AdamW:
    lr: 5.0e-5                     # <-- baseline_adamw winner (lr in {2e-5,5e-5,1e-4})
    weight_decay: 1.0e-3          # <-- baseline_adamw winner (wd in {0,1e-3,1e-2})
  MCSDCA-odLD:
    mcsdca_eta: 1.0e-2             # <-- Stage-3 winner (grid: 3e-3 / 1e-2 / 3e-2)
    mcsdca_epsilon: 1.0e-4        # <-- Stage-3 winner: epsilon_ratio * eta
    mcsdca_beta0: 0.9
  MCSDCA-udLD:
    mcsdca_delta: 0.1             # <-- Stage-4 winner (grid: 0.03 / 0.1 / 0.3)
    mcsdca_epsilon: 1.0e-4       # <-- same absolute epsilon inherited from odLD
    mcsdca_beta0: 0.9
